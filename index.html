// Simulation randomness is seeded (so online peers stay in lockstep); render-only randomness uses Math.random.
let inSim=false,simS=1;function simRand(){simS|=0;simS=simS+0x6D2B79F5|0;let t=Math.imul(simS^simS>>>15,1|simS);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
const RND=()=>inSim?simRand():Math.random();
const rnd=(a,b)=>a+RND()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function limb(x1,y1,x2,y2,t,c){G.fillStyle=c;const dx=x2-x1,dy=y2-y1,n=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))));const o=t>>1;for(let i=0;i<=n;i++)G.fillRect(Math.round(x1+dx*i/n)-o,Math.round(y1+dy*i/n)-o,t,t)}
function zig(x1,y1,x2,y2,n,j,w,glow,core){const pts=[[x1,y1]];for(let i=1;i<n;i++){const t=i/n;pts.push([x1+(x2-x1)*t+rnd(-j,j),y1+(y2-y1)*t+rnd(-j,j)])}pts.push([x2,y2]);for(let i=0;i<pts.length-1;i++)limb(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],w+2,glow);for(let i=0;i<pts.length-1;i++)limb(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],w,core);return pts}
const lighter=fn=>{ctx.globalCompositeOperation='lighter';fn();ctx.globalCompositeOperation='source-over'};
function disc(cx,cy,r,col){for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r)R(cx+x,cy+y,1,1,typeof col==='function'?col(x,y):col)}

// ---------------- AUDIO (synth, no files) ----------------
let AC=null,NB=null,master;
function audio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.45;master.connect(AC.destination);NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=RND()*2-1}catch(e){}}
function noise(dur,type,f0,f1,vol,q=1){if(!AC)return;const t=AC.currentTime,s=AC.createBufferSource();s.buffer=NB;const fl=AC.createBiquadFilter();fl.type=type;fl.Q.value=q;fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(fl).connect(g).connect(master);s.start(t,RND()*.5);s.stop(t+dur+.02)}
function tone(dur,type,f0,f1,vol){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(master);o.start(t);o.stop(t+dur+.02)}

const PX={mods:{},core:null,live:[],back:null,front:null,img:null,oc:null};
const PFX_IDS=['nature/tornado','water/geyser','shadow/shadow-tendrils','shadow/grasping-hands','water/wave-crash','nature/thorns','shadow/eclipse','arcane/portal','arcane/time-stop','nature/root-snare','shadow/black-hole','water/water-orb','scifi/force-field','impacts/parry','projectiles/energy-disc','shadow/shadow-flames','melee/sword-slash','melee/whip-crack','nature/healing-bloom','impacts/crit-hit','water/splash',

(async()=>{try{if(window.PIXELFX){PX.core=PIXELFX.core;Object.assign(PX.mods,PIXELFX.mods)}else{PX.core=await import('./vendor/pixelfx/src/core/index.js');await Promise.all(PFX_IDS.map(async id=>{try{PX.mods[id]=await import(`./vendor/pixelfx/src/fx/${id}.js`)}catch(e){console.warn('pfx',id,e)}}))}
 PX.back=PX.core.createFrame(W,H);PX.front=PX.core.createFrame(W,H);PX.img=new ImageData(W,H);PX.oc=document.createElement('canvas');PX.oc.width=W;PX.oc.height=H}catch(e){console.warn('pixelfx unavailable',e)}})();
function pfx(id,x,y,o={}){const mod=PX.mods[id];if(!mod||!PX.core||!PX.back){if(id==='arcane/portal')fx.push({k:'portal',x,y:y-24,t:0,ml:Math.min(o.dur||40,120)});return null}const opts={x:Math.round(x),y:Math.round(y),flip:!!o.flip,seed:(Math.random()*1e4)|0};if(o.pal)opts.palette=o.pal;
 const fx=PX.core.createFx(mod,opts);if(o.ff){let t=0;while(t<o.ff){fx.update(1/60);t+=1/60}}const e={fx,t:0,dur:o.dur??999,back:!!o.back,owner:o.owner||null,follow:o.follow||null,id};PX.live.push(e);return e}
function updPfx(frozen){for(const e of PX.live){if(frozen&&e.owner===frozen)continue;e.fx.update(1/60);if(++e.t>=e.dur)e.fx.stop();if(e.follow){e.fx.options.x=Math.round(e.follow.x);e.fx.options.y=Math.round(e.follow.y)}}PX.live=PX.live.filter(e=>!e.fx.done())}
function drawPfx(layer){if(!PX.core||!PX.back||!PX.live.length)return;const fr=layer==='back'?PX.back:PX.front;let any=false;
 for(const e of PX.live)if(e.back===(layer==='back')){if(!any){PX.core.clearFrame(fr);fr.ox=Math.round(cam);fr.oy=0;any=true}e.fx.draw(fr)}
 if(!any)return;PX.core.composite(fr,PX.img.data,null);PX.oc.getContext('2d').putImageData(PX.img,0,0);ctx.drawImage(PX.oc,Math.round(cam),0)}
const PAL={

let parts=[],fx=[];
function part(o){parts.push(Object.assign({vx:0,vy:0,g:0,l:30,ml:30,sz:2,k:'fire'},o))}
function flame(x,y,n,sp=4,up=1.2,k='fire'){for(let i=0;i<n;i++){const l=rnd(14,30);part({x:x+rnd(-sp,sp),y:y+rnd(-sp,sp),vx:rnd(-.4,.4),vy:-rnd(.3,up),l,ml:l,sz:rnd(2,4)|0,k})}}
function burst(x,y,n,k='fire',sp=3){for(let i=0;i<n;i++){const a=rnd(0,6.28),v=rnd(.5,sp),l=rnd(12,28);part({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(k==='fire'?.5:0),l,ml:l,sz:rnd(1,3)|0,k,g:k==='debris'?.15:0})}}
function sparkFx(x,y,col,big){fx.push({k:'spark',x,y,t:0,ml:big?12:8,col,big})}
function ring(x,y,col,ml=16,r=30){fx.push({k:'ring',x,y,t:0,ml,r,col})}
function pop(x,y,s,col){fx.push({k:'pop',x,y,s,col,t:0,ml:50})}
function updFx(){for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;if(p.k!=='debris'){p.vx*=.96;p.vy*=.98}p.l--}parts=parts.filter(p=>p.l>0);if(parts.length>1100)parts.splice(0,parts.length-1100);for(const e of fx)e.t++;fx=fx.filter(e=>e.t<e.ml)}
function drawParts(){G=ctx;ctx.globalCompositeOperation='lighter';for(const p of parts){const pal=PF[p.k];if(!pal)continue;const r=p.l/p.ml;const c=pal[Math.min(pal.length-1,(r*pal.length)|0)];
 const s=Math.max(1,Math.round(p.sz*(p.k==='fire'?.5+r*.7:1)));R(p.x-s/2,p.y-s/2,s,s,c)}
 ctx.globalCompositeOperation='source-over';for(const p of parts){if(p.k==='debris')R(p.x,p.y,p.sz,p.sz,'#5b4a6b');if(p.k==='rock')R(p.x,p.y,p.sz,p.sz,'#7a5a32');if(p.k==='dust'){const r=p.l/p.ml,s=Math.round(p.sz*(1.8-r));ctx.globalAlpha=r*.55;R(p.x-s/2,p.y-s/2,s,s,'#8a7a98');ctx.globalAlpha=1}if(p.k==='smoke'){ctx.globalAlpha=p.l/p.ml*.6;R(p.x-2,p.y-2,4,4,'#2a2232');ctx.globalAlpha=1}}}
function drawFx(){G=ctx;for(const e of fx){const t=e.t/e.ml;
 if(e.k==='spark'){const n=e.big?10:8,r0=t*(e.big?16:10),r1=r0+(e.big?7:5)*(1-t);for(let i=0;i<n;i++){const a=i/n*6.283+(e.big?.2:0);limb(e.x+Math.cos(a)*r0,e.y+Math.sin(a)*r0,e.x+Math.cos(a)*r1,e.y+Math.sin(a)*r1,t<.4?2:1,t<.3?'#fff':e.col)}if(t<.25)R(e.x-3,e.y-3,6,6,'#fff')}
 if(e.k==='ring'){const r=e.r*Math.sqrt(t);lighter(()=>{for(let a=0;a<6.283;a+=.12)R(e.x+Math.cos(a)*r-1,e.y+Math.sin(a)*r*.55-1,2,2,e.col)})}
 if(e.k==='trail')lighter(()=>zig(e.x1,e.y,e.x2,e.y,8,5,1,e.c1||'#3f6bff','#fff'));
 if(e.k==='ltrail'){const a=1-t;lighter(()=>{ctx.globalAlpha=a;R(Math.min(e.x1,e.x2),e.y-14,Math.abs(e.x2-e.x1),28,e.col);ctx.globalAlpha=1})}
 if(e.k==='portal'){const sc=Math.min(1,e.t/6,(e.ml-e.t)/6);lighter(()=>{for(let a=0;a<6.283;a+=.15){const r=sc*(1+.15*Math.sin(a*3+frame*.2));R(e.x+Math.cos(a)*8*r,e.y+Math.sin(a)*16*r,2,2,a%1.2<.6?'#b46ae8':'#e4b8ff')}})}
 if(e.k==='sline'){ctx.globalAlpha=(1-t)*.75;lighter(()=>limb(e.x,e.y,e.x+e.d*e.len*(1-t*.4),e.y,1,'#ffffff'));ctx.globalAlpha=1}
 if(e.k==='zap')lighter(()=>zig(e.x,e.y,e.x2,e.y2,3,3,1,'#3f6bff','#ffffff'));

 if(e.k==='blk'){const a=1-t;lighter(()=>{ctx.globalAlpha=a;for(let an=-1.3;an<=1.3;an+=.18)R(e.x+Math.cos(an)*e.d*(8+t*4),e.y+Math.sin(an)*(14+t*4),2,2,an%.36<.18?'#bfeaff':'#ffffff');ctx.globalAlpha=1})}
 if(e.k==='cut'){const a=1-t;lighter(()=>{limb(e.x1,e.y1,e.x2,e.y2,a>.5?3:1,e.col);limb(e.x1,e.y1,e.x2,e.y2,1,'#fff')})}
 if(e.k==='pop'){const y=e.y-t*18;if(t<.85||(e.t>>1)%2)txt(e.s,Math.round(e.x),Math.round(y),8,e.col)}}}

let errInfo=null,errT=0;
function recover(e){console.error('[grimoire-clash]',e);errInfo=String(e&&e.message||e).slice(0,40);errT=240;acc=0;
 try{projs=[];objs=[];fx=[];parts=[];PX.live=[];tstop=null;blackout=0;superPause=0;ultPause=0;hitstop=0;zoom=1;ctx=MAIN;G=MAIN;

 try{acc+=Math.min(100,now-last);last=now;let n=0;while(acc>=1000/60&&n++<8){if(NET.on&&scene==='fight'){netQueueLocal();if(!netReady()){NET.stall++;acc=Math.min(acc,1000/30);break}}step();acc-=1000/60}render()}catch(e){recover(e)}
